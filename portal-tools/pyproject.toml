[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portal-tools"
version = "0.0.1"
description = "Tools for AI agents to interact with the portal"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "requests",
    "sentence-transformers",
    "neo4j",
    "hf_xet",
    "numpy",
    "fastmcp[http]>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
portal-tools-mcp = "portal_tools.mcp_server:main"
